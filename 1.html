<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人聊天室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        
        /* 顶部栏 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-size: 1.4rem;
            font-weight: 700;
        }
        
        .logo i {
            margin-right: 12px;
            font-size: 1.8rem;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .online-indicator {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
        }
        
        .online-dot {
            width: 10px;
            height: 10px;
            background-color: #4cd964;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        
        .btn-login {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-login:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .btn-logout {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-logout:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
        
        /* 主聊天区域 */
        .chat-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* 用户面板 */
        .users-panel {
            width: 280px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            border-bottom: 1px solid #eef2f7;
        }
        
        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            display: flex;
            align-items: center;
        }
        
        .panel-title i {
            margin-right: 10px;
            color: #667eea;
        }
        
        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .user-card {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .user-card:hover {
            background-color: #f8f9ff;
            transform: translateY(-2px);
        }
        
        .user-card.current-user {
            background-color: #f0f4ff;
            border-left: 4px solid #667eea;
        }
        
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 15px;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.2);
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }
        
        .user-status {
            font-size: 0.85rem;
            color: #28a745;
            display: flex;
            align-items: center;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        /* 聊天主区域 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        
        /* 消息区域 */
        .messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-color: #fafbfd;
        }
        
        .message {
            max-width: 75%;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-incoming {
            align-self: flex-start;
        }
        
        .message-outgoing {
            align-self: flex-end;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .message-sender {
            font-weight: 600;
            font-size: 0.95rem;
            color: #555;
        }
        
        .message-time {
            font-size: 0.8rem;
            color: #aaa;
            margin-left: 10px;
        }
        
        .message-outgoing .message-header {
            justify-content: flex-end;
        }
        
        .message-outgoing .message-sender {
            color: #667eea;
        }
        
        .message-bubble {
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        
        .message-incoming .message-bubble {
            background-color: white;
            color: #333;
            border: 1px solid #eef2f7;
            border-top-left-radius: 6px;
        }
        
        .message-outgoing .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-top-right-radius: 6px;
        }
        
        /* 系统消息 */
        .system-message {
            align-self: center;
            text-align: center;
            margin: 15px 0;
            max-width: 90%;
        }
        
        .system-content {
            background-color: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        /* 输入区域 */
        .input-container {
            padding: 20px;
            border-top: 1px solid #eef2f7;
            display: flex;
            gap: 15px;
            align-items: center;
            background-color: white;
        }
        
        .message-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #eef2f7;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background-color: #fafbfd;
        }
        
        .message-input:focus {
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .message-input:disabled {
            background-color: #f5f7fa;
            cursor: not-allowed;
        }
        
        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-send:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-send:active {
            transform: translateY(-1px);
        }
        
        .btn-send:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 登录模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .modal-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .modal-subtitle {
            color: #777;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #eef2f7;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-join {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-join:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .users-panel {
                width: 240px;
            }
            
            .chat-container {
                padding: 15px;
                gap: 15px;
            }
        }
        
        @media (max-width: 768px) {
            .users-panel {
                display: none;
            }
            
            .header {
                padding: 14px 20px;
            }
            
            .chat-container {
                padding: 10px;
            }
            
            .messages-container {
                padding: 20px;
            }
            
            .message {
                max-width: 90%;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-comments"></i>
            <span>多人聊天室</span>
        </div>
        <div class="user-info">
            <div class="online-indicator">
                <span class="online-dot"></span>
                <span id="online-count">0</span> 人在线
            </div>
            <button class="btn btn-login" id="login-btn">加入聊天</button>
        </div>
    </header>

    <!-- 主聊天区域 -->
    <main class="chat-container">
        <!-- 用户面板 -->
        <aside class="users-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fas fa-users"></i>
                    <span>在线用户</span>
                </div>
            </div>
            <div class="users-list" id="users-list">
                <!-- 用户列表将通过JavaScript动态加载 -->
            </div>
        </aside>

        <!-- 聊天主区域 -->
        <section class="chat-main">
            <!-- 消息区域 -->
            <div class="messages-container" id="messages-container">
                <!-- 消息将通过JavaScript动态加载 -->
            </div>

            <!-- 输入区域 -->
            <div class="input-container">
                <input type="text" class="message-input" id="message-input" placeholder="输入消息..." disabled>
                <button class="btn-send" id="send-btn" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </section>
    </main>

    <!-- 登录模态框 -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h2 class="modal-title">加入多人聊天室</h2>
                <p class="modal-subtitle">与在线用户实时聊天，无需注册</p>
            </div>
            <div class="form-group">
                <input type="text" class="form-input" id="username-input" placeholder="请输入您的用户名" autofocus>
                <p style="font-size: 0.9rem; color: #777; margin-top: 8px;">提示：在其他浏览器或标签页中使用不同用户名登录，可实现真实多人聊天</p>
            </div>
            <button class="btn-join" id="join-btn">进入聊天室</button>
        </div>
    </div>

    <script>
        // 使用localStorage模拟服务器存储
        const STORAGE_KEY = 'multi_user_chat';
        
        // 用户状态
        let currentUser = null;
        let isLoggedIn = false;
        let userId = null;
        
        // 从localStorage获取聊天数据
        function getChatData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {
                users: [],
                messages: [],
                messageIdCounter: 1,
                userIdCounter: 1
            };
        }
        
        // 保存聊天数据到localStorage
        function saveChatData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        // 初始化数据
        let chatData = getChatData();
        
        // DOM元素
        const loginBtn = document.getElementById('login-btn');
        const loginModal = document.getElementById('login-modal');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const usersList = document.getElementById('users-list');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const onlineCount = document.getElementById('online-count');
        
        // 初始化函数
        function init() {
            // 检查是否有已登录的用户（从localStorage）
            const savedUser = localStorage.getItem('chat_current_user');
            if (savedUser) {
                const userData = JSON.parse(savedUser);
                loginUser(userData.id, userData.name);
            } else {
                // 显示欢迎消息
                addSystemMessage("欢迎来到多人聊天室！请点击右上角按钮加入聊天。");
            }
            
            renderUsers();
            renderMessages();
            updateOnlineCount();
            setupEventListeners();
            
            // 设置定期刷新
            setInterval(updateChat, 2000);
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 登录按钮
            loginBtn.addEventListener('click', showLoginModal);
            
            // 加入按钮
            joinBtn.addEventListener('click', handleJoin);
            
            // 按Enter键加入
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleJoin();
            });
            
            // 发送消息
            sendBtn.addEventListener('click', sendMessage);
            
            // 按Enter键发送消息
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            // 点击模态框外部关闭
            loginModal.addEventListener('click', (e) => {
                if (e.target === loginModal) {
                    hideLoginModal();
                }
            });
        }
        
        // 显示登录模态框
        function showLoginModal() {
            if (isLoggedIn) {
                // 如果已登录，显示退出确认
                if (confirm('确定要退出登录吗？')) {
                    logout();
                }
                return;
            }
            loginModal.classList.add('active');
            usernameInput.focus();
        }
        
        // 隐藏登录模态框
        function hideLoginModal() {
            loginModal.classList.remove('active');
            usernameInput.value = '';
        }
        
        // 处理加入
        function handleJoin() {
            const username = usernameInput.value.trim();
            
            if (!username) {
                alert('请输入用户名');
                return;
            }
            
            if (username.length < 2) {
                alert('用户名至少需要2个字符');
                return;
            }
            
            if (username.length > 20) {
                alert('用户名不能超过20个字符');
                return;
            }
            
            // 检查用户名是否已存在（在活跃用户中）
            const existingUser = chatData.users.find(user => 
                user.name === username && user.active
            );
            
            if (existingUser) {
                alert('该用户名已被使用，请选择其他用户名');
                return;
            }
            
            // 生成用户ID
            const userId = chatData.userIdCounter++;
            
            // 登录用户
            loginUser(userId, username);
            hideLoginModal();
        }
        
        // 登录用户
        function loginUser(id, name) {
            currentUser = name;
            userId = id;
            isLoggedIn = true;
            
            // 保存当前用户信息
            localStorage.setItem('chat_current_user', JSON.stringify({
                id: userId,
                name: currentUser
            }));
            
            // 添加用户到在线列表
            const existingUserIndex = chatData.users.findIndex(user => user.id === userId);
            
            if (existingUserIndex >= 0) {
                // 更新现有用户
                chatData.users[existingUserIndex].active = true;
                chatData.users[existingUserIndex].lastSeen = new Date().toISOString();
            } else {
                // 添加新用户
                chatData.users.push({
                    id: userId,
                    name: currentUser,
                    active: true,
                    joined: new Date().toISOString(),
                    lastSeen: new Date().toISOString()
                });
            }
            
            // 保存数据
            saveChatData(chatData);
            
            // 更新界面
            loginBtn.textContent = '退出聊天';
            loginBtn.classList.remove('btn-login');
            loginBtn.classList.add('btn-logout');
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
            
            // 渲染更新后的用户列表
            renderUsers();
            updateOnlineCount();
            
            // 添加系统消息
            addSystemMessage(`${currentUser} 加入了聊天室`);
        }
        
        // 退出登录
        function logout() {
            // 标记用户为离线
            const userIndex = chatData.users.findIndex(user => user.id === userId);
            if (userIndex >= 0) {
                chatData.users[userIndex].active = false;
                chatData.users[userIndex].lastSeen = new Date().toISOString();
            }
            
            // 保存数据
            saveChatData(chatData);
            
            const oldUser = currentUser;
            
            // 重置状态
            currentUser = null;
            userId = null;
            isLoggedIn = false;
            localStorage.removeItem('chat_current_user');
            
            loginBtn.textContent = '加入聊天';
            loginBtn.classList.remove('btn-logout');
            loginBtn.classList.add('btn-login');
            messageInput.disabled = true;
            sendBtn.disabled = true;
            messageInput.value = '';
            
            // 更新界面
            renderUsers();
            updateOnlineCount();
            
            // 添加系统消息
            addSystemMessage(`${oldUser} 离开了聊天室`);
        }
        
        // 渲染用户列表
        function renderUsers() {
            usersList.innerHTML = '';
            
            // 筛选活跃用户
            const activeUsers = chatData.users.filter(user => user.active);
            
            if (activeUsers.length === 0) {
                usersList.innerHTML = `
                    <div style="text-align: center; padding: 30px 20px; color: #999;">
                        <i class="fas fa-user-friends" style="font-size: 2rem; margin-bottom: 15px; display: block;"></i>
                        <p>暂无在线用户</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">成为第一个加入的用户</p>
                    </div>
                `;
                return;
            }
            
            // 按加入时间排序（最近加入的在前）
            activeUsers.sort((a, b) => new Date(b.joined) - new Date(a.joined));
            
            activeUsers.forEach(user => {
                const userElement = document.createElement('div');
                userElement.className = `user-card ${user.id === userId ? 'current-user' : ''}`;
                
                // 计算加入时间
                const joinedTime = new Date(user.joined);
                const timeStr = joinedTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                userElement.innerHTML = `
                    <div class="user-avatar">${user.name.charAt(0)}</div>
                    <div class="user-details">
                        <div class="user-name">${user.name}</div>
                        <div class="user-status">
                            <span class="status-dot"></span>
                            <span>${user.id === userId ? '我' : '在线'} • 加入于 ${timeStr}</span>
                        </div>
                    </div>
                `;
                usersList.appendChild(userElement);
            });
        }
        
        // 渲染消息
        function renderMessages() {
            messagesContainer.innerHTML = '';
            
            if (chatData.messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px; color: #999;">
                        <i class="fas fa-comments" style="font-size: 3rem; margin-bottom: 20px; display: block; color: #e0e0e0;"></i>
                        <h3 style="font-weight: 600; margin-bottom: 10px;">聊天室是空的</h3>
                        <p>发送第一条消息开始聊天吧！</p>
                    </div>
                `;
                return;
            }
            
            // 按时间排序（最早的在前）
            const sortedMessages = [...chatData.messages].sort((a, b) => 
                new Date(a.timestamp) - new Date(b.timestamp)
            );
            
            sortedMessages.forEach(message => {
                if (message.type === 'system') {
                    addSystemMessageToUI(message.content);
                } else {
                    const isOutgoing = message.senderId === userId;
                    addMessageToUI(
                        message.senderName,
                        message.content,
                        message.timestamp,
                        isOutgoing
                    );
                }
            });
            
            // 滚动到底部
            scrollToBottom();
        }
        
        // 发送消息
        function sendMessage() {
            const content = messageInput.value.trim();
            
            if (!content) return;
            
            // 创建消息
            const message = {
                id: chatData.messageIdCounter++,
                senderId: userId,
                senderName: currentUser,
                content: content,
                timestamp: new Date().toISOString(),
                type: 'user'
            };
            
            // 添加到消息列表
            chatData.messages.push(message);
            
            // 保存数据
            saveChatData(chatData);
            
            // 添加到UI
            addMessageToUI(currentUser, content, message.timestamp, true);
            
            // 清空输入框
            messageInput.value = '';
            messageInput.focus();
            
            // 滚动到底部
            scrollToBottom();
        }
        
        // 更新聊天（检查新消息和用户）
        function updateChat() {
            if (!isLoggedIn) return;
            
            // 获取最新数据
            const newData = getChatData();
            
            // 检查是否有新消息
            const newMessages = newData.messages.filter(newMsg => {
                return !chatData.messages.some(oldMsg => oldMsg.id === newMsg.id);
            });
            
            // 检查用户状态变化
            const userChanged = JSON.stringify(newData.users) !== JSON.stringify(chatData.users);
            
            // 更新数据
            chatData = newData;
            
            // 如果有新消息，添加到UI
            if (newMessages.length > 0) {
                newMessages.forEach(message => {
                    if (message.type === 'system') {
                        addSystemMessageToUI(message.content);
                    } else if (message.senderId !== userId) {
                        // 只显示其他人的消息（自己的消息已经显示过了）
                        addMessageToUI(
                            message.senderName,
                            message.content,
                            message.timestamp,
                            false
                        );
                    }
                });
                
                // 滚动到底部
                scrollToBottom();
            }
            
            // 如果用户状态变化，更新用户列表
            if (userChanged) {
                renderUsers();
                updateOnlineCount();
            }
            
            // 更新当前用户的最后活动时间
            if (isLoggedIn) {
                const userIndex = chatData.users.findIndex(user => user.id === userId);
                if (userIndex >= 0) {
                    chatData.users[userIndex].lastSeen = new Date().toISOString();
                    saveChatData(chatData);
                }
            }
        }
        
        // 添加系统消息
        function addSystemMessage(content) {
            const message = {
                id: chatData.messageIdCounter++,
                content: content,
                timestamp: new Date().toISOString(),
                type: 'system'
            };
            
            chatData.messages.push(message);
            saveChatData(chatData);
            addSystemMessageToUI(content);
        }
        
        // 添加系统消息到UI
        function addSystemMessageToUI(content) {
            const messageElement = document.createElement('div');
            messageElement.className = 'system-message';
            messageElement.innerHTML = `<div class="system-content">${content}</div>`;
            messagesContainer.appendChild(messageElement);
        }
        
        // 添加消息到UI
        function addMessageToUI(sender, content, timestamp, isOutgoing) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isOutgoing ? 'message-outgoing' : 'message-incoming'}`;
            
            // 格式化时间
            const time = new Date(timestamp);
            const timeStr = time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            messageElement.innerHTML = `
                <div class="message-header">
                    <span class="message-sender">${isOutgoing ? '我' : sender}</span>
                    <span class="message-time">${timeStr}</span>
                </div>
                <div class="message-bubble">${content}</div>
            `;
            
            messagesContainer.appendChild(messageElement);
        }
        
        // 滚动到底部
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // 更新在线人数
        function updateOnlineCount() {
            const activeUsers = chatData.users.filter(user => user.active).length;
            onlineCount.textContent = activeUsers;
        }
        
        // 初始化应用
        init();
        
        // 页面关闭前保存用户状态
        window.addEventListener('beforeunload', () => {
            if (isLoggedIn) {
                // 标记用户为离线
                const userIndex = chatData.users.findIndex(user => user.id === userId);
                if (userIndex >= 0) {
                    chatData.users[userIndex].active = false;
                    chatData.users[userIndex].lastSeen = new Date().toISOString();
                    saveChatData(chatData);
                }
            }
        });
    </script>
</body>
</html>
